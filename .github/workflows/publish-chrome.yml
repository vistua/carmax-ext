name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'content.js'
      - 'background.js'
      - 'popup.js'
      - 'popup.html'
      - 'popup.css'
      - 'icons/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать после загрузки (true/false)'
        required: false
        default: 'true'
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Build extension ZIP
        run: |
          zip -r carmax-extension.zip \
            manifest.json \
            content.js \
            background.js \
            popup.html \
            popup.js \
            popup.css \
            icons/
          echo "ZIP size: $(du -sh carmax-extension.zip | cut -f1)"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: carmax-extension-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: carmax-extension.zip
          retention-days: 90

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID:    ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID:       ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET:   ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN:   ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISH:         ${{ inputs.publish || 'true' }}
        run: |
          set -e

          # ── 1. Get OAuth2 access token ──────────────────────────────────
          echo "Getting access token..."
          TOKEN_RESP=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "Access token obtained."

          # ── 2. Upload ZIP to Chrome Web Store ───────────────────────────
          echo "Uploading extension ZIP..."
          UPLOAD_RESP=$(curl -sf -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T carmax-extension.zip)
          echo "Upload response: $UPLOAD_RESP"

          UPLOAD_STATE=$(echo "$UPLOAD_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uploadState','UNKNOWN'))")
          echo "Upload state: $UPLOAD_STATE"

          if [ "$UPLOAD_STATE" != "SUCCESS" ]; then
            echo "Upload failed!"
            exit 1
          fi

          # ── 3. Publish ──────────────────────────────────────────────────
          if [ "$PUBLISH" = "true" ]; then
            echo "Publishing extension..."
            PUB_RESP=$(curl -sf -X POST \
              "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "x-goog-api-version: 2" \
              -H "Content-Length: 0")
            echo "Publish response: $PUB_RESP"

            PUB_STATUS=$(echo "$PUB_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',['UNKNOWN'])[0])")
            echo "Publish status: $PUB_STATUS"

            if [ "$PUB_STATUS" = "OK" ]; then
              echo "Successfully published v${{ steps.version.outputs.version }} to Chrome Web Store!"
            else
              echo "Publish may need review — status: $PUB_STATUS"
            fi
          else
            echo "Skipping publish (publish=false). ZIP uploaded and ready for manual review."
          fi

      - name: Commit updated ZIP to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add carmax-extension.zip
          if git diff --staged --quiet; then
            echo "ZIP unchanged, nothing to commit."
          else
            git commit -m "build: update carmax-extension.zip v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi
